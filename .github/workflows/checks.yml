name: Native checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev desktop-file-utils
      - run: cmake -S . -B target -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build target --parallel 2
      - run: ctest --test-dir target --output-on-failure
      - run: desktop-file-validate packaging/io.github.tcballard.FamiliarPaint.desktop
      - name: Build preview archive
        run: |
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-preview.sh "$PWD/target" "$PWD/dist"
          cp RELEASE_NOTES.md dist/
      - name: Validate packaged install and rendering
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tar -xzf familiar-paint-*-linux-x86_64.tar.gz
          bash familiar-paint-*/scripts/smoke-preview.sh
      - uses: actions/upload-artifact@v4
        with:
          name: familiar-paint-preview-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: familiar-paint-preview-linux-x86_64
          path: dist
      - name: Create unpublished prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease \
            --title "Familiar Paint $GITHUB_REF_NAME — Preview" \
            --notes-file dist/RELEASE_NOTES.md dist/*.tar.gz dist/SHA256SUMS
